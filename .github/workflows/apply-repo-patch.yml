name: Apply Repo Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: |
          set -euo pipefail
          curl -fsSL https://paste.rs/iMGxK -o /tmp/change.patch
          echo "49355d7ecfe644b82eb1c08419e44138d2bb0ec03da95226e6ffb7fb88fcea4b  /tmp/change.patch" | sha256sum -c -
          git apply --whitespace=nowarn /tmp/change.patch

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add the SEUsign repository automatically on first launch"
          git push origin HEAD:main
