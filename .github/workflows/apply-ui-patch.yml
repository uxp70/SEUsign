name: Apply UI Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: |
          set -euo pipefail
          curl -fsSL https://paste.rs/PsSnk -o /tmp/change.patch
          echo "42d8604a89adfed588c56e6e94b2ee53cd0e7a97a5184498b838a629f831182a  /tmp/change.patch" | sha256sum -c -
          git apply --whitespace=nowarn /tmp/change.patch

      - name: Commit and tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: make every sideloading.net certificate selectable and reshape the Library and Sources lists"
          git push origin HEAD:main
          git tag v4.2.0
          git push origin v4.2.0
