name: Apply patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply and push
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://paste.rs/ZproY -o /tmp/changes.patch
          echo "0e4165728cc38d2a6e35d4497d79b1c2e15bd2a01880dc939f76d737bb74c661  /tmp/changes.patch" | sha256sum -c -
          git apply --whitespace=nowarn /tmp/changes.patch
          git config user.name "SEUsign Bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "fix: give the verification help view an explicit initializer"
          git push origin HEAD:main
