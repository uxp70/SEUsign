name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'
      - name: Prepare dependencies (Xcode)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.0.app
          xcodebuild -version

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Feather.xcodeproj \
            -scheme Feather \
            -derivedDataPath "$TMPDIR/Feather/iphoneos" \
            -skipPackagePluginValidation || true

      - name: Build
        run: |
          build_platform() {
            for attempt in 1 2 3; do
              echo "::group::$1 (attempt ${attempt})"
              if make "$1"; then
                echo "::endgroup::"
                return 0
              fi
              echo "::endgroup::"
              sleep 15
            done
            echo "$1 failed after 3 attempts" >&2
            return 1
          }
          build_platform iphoneos
          build_platform maccatalyst

      - name: Get Version
        id: get_version
        run: |
          # After the Catalyst pass, _build/Payload holds a macOS-style bundle
          # (Contents/Info.plist), so read the version from the shipped IPA.
          unzip -p packages/Sigil.ipa Payload/Sigil.app/Info.plist > "$RUNNER_TEMP/Info.plist"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$RUNNER_TEMP/Info.plist")
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Sigil v${VERSION}"
          ls -lh packages

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: Sigil-packages
          path: packages/*
          if-no-files-found: error
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v3.0.2
        with:
          name: Sigil v${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          files: |
            packages/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          token: ${{ secrets.GITHUB_TOKEN }}
