name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'
      - name: Prepare dependencies (Xcode)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.0.app
          xcodebuild -version

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Feather.xcodeproj \
            -scheme Feather \
            -derivedDataPath "$TMPDIR/Feather/iphoneos" \
            -skipPackagePluginValidation || true

      - name: Build
        run: |
          for attempt in 1 2 3; do
            echo "::group::Build attempt ${attempt}"
            if make iphoneos; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            sleep 15
          done
          echo "Build failed after 3 attempts" >&2
          exit 1

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" _build/Payload/*.app/Info.plist)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SEUsign-ipa
          path: packages/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v3.0.2
        with:
          name: SEUsign v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          files: |
            packages/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
