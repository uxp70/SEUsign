name: Apply SEU Cleanup Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: |
          set -euo pipefail
          curl -fsSL https://paste.rs/FTiKe -o /tmp/change.patch
          echo "43a11415b5e19a25eb266cf2662e76ee229d9d28d32d32d6e25cbb04975e5db1  /tmp/change.patch" | sha256sum -c -
          git apply --whitespace=nowarn /tmp/change.patch

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: migrate the auto-added source to the SEU community repository"
          git push origin HEAD:main
