name: Apply SEU Repo Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: |
          set -euo pipefail
          curl -fsSL https://paste.rs/BzWb9 -o /tmp/change.patch
          echo "107340614c4cd87868ff4838e155f6ec26602c7622f71574274f38655c0f2639  /tmp/change.patch" | sha256sum -c -
          git apply --whitespace=nowarn /tmp/change.patch

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: auto-add the SEU community repository instead of the app repo"
          git push origin HEAD:main
