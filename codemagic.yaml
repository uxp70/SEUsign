workflows:
  ios-release:
    name: SEUsign iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: thewonderofyou.SEUsign
    scripts:
      - name: Checkout submodules
        script: |
          git submodule update --init --recursive
      - name: Install dependencies
        script: |
          brew install jq || true
      - name: Build
        script: |
          make
    artifacts:
      - packages/*.ipa
      - packages/*.zip
    publishing:
      email:
        recipients:
          - uxp70@users.noreply.github.com
        notify:
          success: true
          failure: true
